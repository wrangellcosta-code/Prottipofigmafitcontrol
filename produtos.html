<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Produtos - FitControl</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <header class="bg-primary text-white py-2">
    <div class="container d-flex justify-content-between align-items-center">
      <img src="IMAGEM/FitControl-Logo.jpeg" alt="Logotipo da FitControl" width="45" height="45" class="rounded">
      <span class="h5 mb-0">FitControl</span>
      <a href="index.html" class="btn btn-outline-light btn-sm">Sair</a>
    </div>
  </header>

  <nav class="navbar navbar-expand-sm bg-dark navbar-dark">
    <div class="container">
      <ul class="navbar-nav">
        <li class="nav-item"><a class="nav-link" href="paineldecontrole.html">Painel de Controle</a></li>
        <li class="nav-item"><a class="nav-link active" href="produtos.html">Produtos</a></li>
        <li class="nav-item"><a class="nav-link" href="lotes.html">Lotes</a></li>
        <li class="nav-item"><a class="nav-link" href="clientes.html">Clientes</a></li>
        <li class="nav-item"><a class="nav-link" href="relatorios.html">Relatórios</a></li>
      </ul>
    </div>
  </nav>

  <main class="container my-4">

    <section class="card p-3 mb-4 shadow-sm">
      <h3>Cadastrar produto</h3>

      <form>
        <div class="row g-2">

          <div class="col-md-6">
            <label for="nome" class="form-label">Nome*</label>
            <input type="text" id="nome" class="form-control" required>
          </div>

          <div class="col-md-6">
            <label for="marca" class="form-label">Marca*</label>
            <input type="text" id="marca" class="form-control" required>
          </div>

          <div class="col-md-6">
            <label for="categoria" class="form-label">Categoria</label>
            <select id="categoria" class="form-select">
              <option>Proteínas</option>
              <option>Termogênicos</option>
              <option>Vitaminas</option>
            </select>
          </div>

          <div class="col-md-3">
            <label for="preco" class="form-label">Preço (R$)*</label>
            <input type="number" step="0.01" id="preco" class="form-control" required>
          </div>

          <div class="col-md-3">
            <label for="unidade" class="form-label">Unidade*</label>
            <input type="text" id="unidade" placeholder="ex: 900g" class="form-control" required>
          </div>

          <div class="col-12">
            <button type="submit" class="btn btn-success">Cadastrar produto</button>
          </div>

        </div>
      </form>
    </section>

    <h3>Produtos cadastrados</h3>

    <table class="table table-bordered table-striped">
      <thead class="table-dark">
        <tr>
          <th>Nome</th>
          <th>Marca</th>
          <th>Categoria</th>
          <th>Preço</th>
          <th>Unidade</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Whey 900g</td>
          <td>Growth</td>
          <td>Proteínas</td>
          <td>R$ 129,90</td>
          <td>900g</td>
        </tr>
        <tr>
          <td>Creatina 300g</td>
          <td>Integralmedica</td>
          <td>Desempenho</td>
          <td>R$ 89,90</td>
          <td>300g</td>
        </tr>
      </tbody>
    </table>

  </main>

  <footer class="bg-dark text-white text-center py-3">
    <small>FitControl 2026 - Peodutos</small>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
